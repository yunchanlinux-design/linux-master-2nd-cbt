<style>
:root{color-scheme:light;--bg:#f4f6fb;--panel:#fff;--text:#182033;--muted:#657087;--line:#dfe4ee;--accent:#4f46e5;--soft:#eef2ff;--good:#15803d;--bad:#b91c1c} [data-theme=dark]{color-scheme:dark;--bg:#10131b;--panel:#191e2b;--text:#e8ebf4;--muted:#a2abc0;--line:#30384b;--accent:#a5b4fc;--soft:#252c45;--good:#4ade80;--bad:#fca5a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,select,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:var(--panel);color:var(--text)}button.primary{background:var(--accent);color:white;border-color:transparent}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}header{background:var(--panel);border-bottom:1px solid var(--line);padding:15px max(18px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header h1{font-size:20px;margin:0}header p{margin:2px 0;color:var(--muted);font-size:13px}.wrap{max-width:1100px;margin:24px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}.stat strong{display:block;font-size:25px}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;margin-top:16px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{text-align:left}.nav button.active{background:var(--soft);border-color:var(--accent)}.panel h2{margin:0 0 12px;font-size:21px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar select{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:9px}.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.tag{font-size:12px;color:var(--accent);background:var(--soft);padding:4px 8px;border-radius:99px}.question{font-size:18px;font-weight:650;margin:20px 0}.choices{display:grid;gap:9px}.choice{display:flex;gap:10px;text-align:left;align-items:flex-start;padding:13px}.choice.selected{border-color:var(--accent);background:var(--soft)}.choice .letter{font-weight:700;min-width:22px}.feedback{border-radius:12px;background:var(--soft);padding:14px;margin-top:14px}.feedback.good{border-left:4px solid var(--good)}.feedback.bad{border-left:4px solid var(--bad)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.progress{height:7px;background:var(--line);border-radius:10px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--accent);width:0}.listitem{border-bottom:1px solid var(--line);padding:12px 0}.listitem:last-child{border:0}.empty{padding:28px;text-align:center;color:var(--muted)}.hide{display:none!important}a{color:var(--accent)}footer{font-size:12px;color:var(--muted);padding:20px 0} @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.wrap{margin:14px auto}.stat,.panel{padding:14px}}

<body><header><div><h1>🐧 Linux Master 2급 CBT</h1><p>단일 HTML · 브라우저 로컬 저장 · 자체 제작 연습문제</p></div><button id="themeBtn" aria-label="테마 전환">🌙 테마</button></header>
<main class="wrap"><section class="stats" aria-label="학습 통계"><div class="stat"><span class="muted">전체 문항</span><strong id="total">15</strong></div><div class="stat"><span class="muted">풀이 완료</span><strong id="done">0</strong></div><div class="stat"><span class="muted">정답률</span><strong id="rate">-</strong></div><div class="stat"><span class="muted">오답 노트</span><strong id="wrongCount">0</strong></div></section>
<div class="layout"><aside class="nav" aria-label="메뉴"><button class="active" data-view="study">📘 문제 풀기</button><button data-view="exam">⏱️ 모의고사</button><button data-view="wrong">📝 오답 노트</button><button data-view="saved">⭐ 북마크</button><button data-view="statsView">📊 학습 기록</button><button data-view="data">💾 백업 / 복원</button><button data-view="archive">🗂️ 7개년 자료실</button></aside>
<section class="panel"><div id="mainView"></div></section></div>
<footer>7개년 조사 범위: 2017~2023년(ComcBT 게시판에서 확인되는 최신 연도 2023년 기준). 현재 앱에는 자체 제작 연습문제 15개만 있으며 실제 기출·복원 문항은 아직 포함되지 않았습니다. ComcBT 게시물은 출처·이용 조건을 확인한 뒤 반영해야 합니다. <a href="https://www.comcbt.com/xe/index.php?mid=r2" target="_blank" rel="noopener">ComcBT 리눅스마스터 2급 게시판 열기</a></footer></main>
<script>
const questions=[
{id:1,cat:"리눅스 기초",q:"현재 작업 중인 디렉터리의 절대 경로를 출력하는 명령은?",a:["pwd","cd","ls","whoami"],ans:0,exp:"pwd는 현재 작업 디렉터리의 경로를 출력합니다."},
{id:2,cat:"파일·디렉터리",q:"숨김 파일을 포함하여 디렉터리 내용을 자세히 표시하는 명령으로 알맞은 것은?",a:["ls -lh","ls -la","dir -r","show -a"],ans:1,exp:"ls -la는 숨김 항목을 포함하고 상세 목록 형식으로 표시합니다."},
{id:3,cat:"권한",q:"파일 소유자에게 읽기·쓰기·실행, 그룹과 기타 사용자에게 읽기 권한을 주는 권한 값은?",a:["644","755","744","754"],ans:2,exp:"744는 소유자 7(rwx), 그룹 4(r--), 기타 사용자 4(r--)입니다."},
{id:4,cat:"파일·디렉터리",q:"파일을 다른 이름으로 복사할 때 사용하는 명령은?",a:["mv","cp","rm","ln"],ans:1,exp:"cp는 파일이나 디렉터리를 복사합니다."},
{id:5,cat:"프로세스",q:"실행 중인 프로세스 목록을 확인하는 대표적인 명령은?",a:["ps","chmod","mount","uname"],ans:0,exp:"ps는 프로세스 상태 정보를 출력합니다."},
{id:6,cat:"사용자·그룹",q:"현재 로그인한 사용자의 이름을 출력하는 명령은?",a:["hostname","whoami","uname","id -gname"],ans:1,exp:"whoami는 유효 사용자 ID에 해당하는 사용자 이름을 출력합니다."},
{id:7,cat:"패키지",q:"Debian 계열에서 로컬 .deb 패키지 설치에 사용하는 저수준 패키지 도구는?",a:["rpm","dpkg","pacman","zypper"],ans:1,exp:"dpkg는 Debian 계열의 패키지 관리 도구입니다."},
{id:8,cat:"파일·디렉터리",q:"파일의 마지막 부분을 기본 10줄 출력하는 명령은?",a:["head","tail","cut","sort"],ans:1,exp:"tail은 파일의 끝부분을 출력하며 기본값은 마지막 10줄입니다."},
{id:9,cat:"권한",q:"파일의 접근 권한을 변경하는 명령은?",a:["chown","chmod","chgrp","umask"],ans:1,exp:"chmod는 파일 모드(접근 권한)를 변경합니다."},
{id:10,cat:"파일·디렉터리",q:"텍스트에서 특정 문자열 패턴을 검색하는 명령은?",a:["grep","tar","dd","df"],ans:0,exp:"grep은 입력이나 파일에서 패턴과 일치하는 줄을 찾습니다."},
{id:11,cat:"파일시스템",q:"마운트된 파일시스템의 디스크 공간 사용량을 확인하는 명령은?",a:["du","df","free","top"],ans:1,exp:"df는 파일시스템의 사용량과 남은 공간을 표시합니다."},
{id:12,cat:"파일시스템",q:"디렉터리와 그 하위 항목의 디스크 사용량을 확인하는 명령은?",a:["du","df","fdisk","lsblk"],ans:0,exp:"du는 파일 및 디렉터리가 사용하는 디스크 공간을 계산합니다."},
{id:13,cat:"압축·아카이브",q:"tar 아카이브를 만들 때 일반적으로 사용하는 옵션 조합은?",a:["-xvf","-cvf","-tvf","-rvf"],ans:1,exp:"-c는 생성, -v는 처리 내역 표시, -f는 아카이브 파일 지정입니다."},
{id:14,cat:"시스템 정보",q:"커널 이름과 시스템 정보를 출력하는 명령은?",a:["uname","uptime","date","env"],ans:0,exp:"uname은 커널 및 시스템 정보를 표시합니다."},
{id:15,cat:"네트워크",q:"IP 주소와 네트워크 인터페이스 정보를 확인하는 현대적인 리눅스 명령은?",a:["ip addr","route add","netstat -r only","dig addr"],ans:0,exp:"ip addr는 네트워크 인터페이스와 주소 정보를 보여줍니다."}
];
const KEY="lm2cbt.v1";let state=load();let view="study",idx=0,filter="전체",examOrder=[],examMode=false,examAnswers={},examStart=0;
function load(){try{return Object.assign({answers:{},wrong:[],saved:[],history:[],theme:"light"},JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{return {answers:{},wrong:[],saved:[],history:[],theme:"light"}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderStats()}
function renderStats(){let vals=Object.values(state.answers),correct=vals.filter(x=>x.correct).length;document.getElementById("total").textContent=questions.length;document.getElementById("done").textContent=vals.length;document.getElementById("rate").textContent=vals.length?Math.round(correct/vals.length*100)+"%":"-";document.getElementById("wrongCount").textContent=state.wrong.length;document.getElementById("themeBtn").textContent=state.theme==="dark"?"☀️ 테마":"🌙 테마";document.documentElement.dataset.theme=state.theme}
function el(id){return document.getElementById(id)}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){renderStats();document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));const root=el("mainView");if(view==="study")renderStudy(root);else if(view==="exam")renderExam(root);else if(view==="wrong")renderList(root,state.wrong,"오답 노트");else if(view==="saved")renderList(root,state.saved,"북마크");else if(view==="statsView")renderHistory(root);else if(view==="archive")renderArchive(root);else renderData(root)}
function renderStudy(root){let list=questions.filter(q=>filter==="전체"||q.cat===filter);if(idx>=list.length)idx=0;let q=list[idx];if(!q){root.innerHTML='<div class="empty">표시할 문제가 없습니다.</div>';return}let record=state.answers[q.id],cats=["전체",...new Set(questions.map(q=>q.cat))];root.innerHTML='<div class="toolbar"><label>분류 <select id="filter">'+cats.map(c=>'<option '+(c===filter?'selected':'')+'>'+safe(c)+'</option>').join("")+'</select></label><button id="resetFilter">처음부터</button></div><div class="qtop"><span class="tag">'+safe(q.cat)+'</span><span class="muted">'+(idx+1)+' / '+list.length+'</span></div><div class="progress"><div style="width:'+((idx+1)/list.length*100)+'%"></div></div><div class="question">'+safe(q.q)+'</div><div class="choices">'+q.a.map((a,i)=>'<button class="choice '+(record&&record.choice===i?'selected':'')+'" data-answer="'+i+'"><span class="letter">'+(i+1)+'.</span><span>'+safe(a)+'</span></button>').join("")+'</div>'+(record?'<div class="feedback '+(record.correct?'good':'bad')+'"><strong>'+(record.correct?'정답입니다!':'오답입니다.')+'</strong><p>정답: '+(q.ans+1)+'. '+safe(q.a[q.ans])+'</p>'+safe(q.exp)+'</div>':'')+'<div class="actions"><button id="prev">← 이전</button><button id="next" class="primary">다음 →</button><button id="bookmark">'+(state.saved.includes(q.id)?"★ 북마크됨":"☆ 북마크")+'</button><button id="showAnswer">정답·해설 보기</button></div>';
el("filter").onchange=e=>{filter=e.target.value;idx=0;render()};el("resetFilter").onclick=()=>{idx=0;render()};root.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>answer(q,Number(b.dataset.answer)));el("prev").onclick=()=>{idx=(idx-1+list.length)%list.length;render()};el("next").onclick=()=>{idx=(idx+1)%list.length;render()};el("bookmark").onclick=()=>toggleSaved(q.id);el("showAnswer").onclick=()=>{if(!state.answers[q.id])answer(q,-1);else render()}}
function answer(q,choice){state.answers[q.id]={choice,correct:choice===q.ans&&choice!==-1,at:Date.now()};if(choice!==q.ans&&!state.wrong.includes(q.id))state.wrong.push(q.id);else if(choice===q.ans)state.wrong=state.wrong.filter(id=>id!==q.id);save();render()}
function toggleSaved(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();render()}
function renderExam(root){root.innerHTML='<h2>모의고사</h2><p class="muted">자체 제작 연습문제에서 무작위로 10문항을 풀어보세요.</p><div class="actions"><button class="primary" id="startExam">모의고사 시작 / 다시 시작</button></div>'+(examMode?'<p>진행: '+Object.keys(examAnswers).length+' / '+examOrder.length+'</p><div class="progress"><div style="width:'+Object.keys(examAnswers).length/examOrder.length*100+'%"></div></div><div id="examQ"></div><div class="actions"><button id="submitExam" class="primary">제출 및 채점</button></div>':"");el("startExam").onclick=()=>{examOrder=[...questions].sort(()=>Math.random()-.5).slice(0,10).map(q=>q.id);examAnswers={};examStart=Date.now();examMode=true;renderExam(el("mainView"));};if(examMode){let q=questions.find(q=>q.id===examOrder.find(id=>examAnswers[id]===undefined)||examOrder[examOrder.length-1]);let done=Object.keys(examAnswers).length;if(done<examOrder.length){q=questions.find(q=>q.id===examOrder.find(id=>examAnswers[id]===undefined));el("examQ").innerHTML='<div class="tag">'+safe(q.cat)+'</div><div class="question">'+safe(q.q)+'</div><div class="choices">'+q.a.map((a,i)=>'<button class="choice '+(examAnswers[q.id]===i?'selected':'')+'" data-e="'+i+'">'+(i+1)+'. '+safe(a)+'</button>').join("")+'</div>';el("examQ").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{examAnswers[q.id]=Number(b.dataset.e);renderExam(el("mainView"))})}else el("examQ").innerHTML='<div class="feedback">모든 문항에 답했습니다. 제출하면 결과가 기록됩니다.</div>';el("submitExam").onclick=()=>{let score=examOrder.filter(id=>examAnswers[id]===questions.find(q=>q.id===id).ans).length;state.history.unshift({at:Date.now(),score,total:examOrder.length,seconds:Math.round((Date.now()-examStart)/1000)});state.history=state.history.slice(0,50);examMode=false;save();root.innerHTML='<h2>모의고사 결과</h2><div class="stat"><strong>'+score+' / '+examOrder.length+'</strong><span>정답률 '+Math.round(score/examOrder.length*100)+'%</span></div><p>소요 시간: '+Math.round((Date.now()-examStart)/60000)+'분</p><button id="again" class="primary">다시 풀기</button>';el("again").onclick=()=>{view="exam";render()}}}}
function renderList(root,ids,title){let qs=ids.map(id=>questions.find(q=>q.id===id)).filter(Boolean);root.innerHTML='<h2>'+title+'</h2>'+(qs.length?qs.map(q=>'<div class="listitem"><span class="tag">'+safe(q.cat)+'</span><p><strong>'+safe(q.q)+'</strong></p><p class="muted">정답: '+(q.ans+1)+'. '+safe(q.a[q.ans])+'</p><p>'+safe(q.exp)+'</p><div class="actions"><button data-go="'+q.id+'">문제 열기</button><button data-remove="'+q.id+'">목록에서 제거</button></div></div>').join(""):'<div class="empty">아직 항목이 없습니다.</div>');root.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{idx=questions.findIndex(q=>q.id===Number(b.dataset.go));filter="전체";view="study";render()});root.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{let id=Number(b.dataset.remove);if(view==="wrong")state.wrong=state.wrong.filter(x=>x!==id);else state.saved=state.saved.filter(x=>x!==id);save();render()})}
function renderHistory(root){root.innerHTML='<h2>학습 기록</h2><p>문제 풀이 기록은 이 브라우저에 저장됩니다.</p><p>풀이한 고유 문항: '+Object.keys(state.answers).length+' / '+questions.length+'</p><p>북마크: '+state.saved.length+'개 · 오답 노트: '+state.wrong.length+'개</p><h3>모의고사 결과</h3>'+(state.history.length?state.history.map(h=>'<div class="listitem">'+new Date(h.at).toLocaleString('ko-KR')+' — '+h.score+'/'+h.total+' ('+Math.round(h.score/h.total*100)+'%), '+Math.floor(h.seconds/60)+'분 '+h.seconds%60+'초</div>').join(""):'<p class="muted">아직 모의고사 기록이 없습니다.</p>')+'<div class="actions"><button id="clearHistory">학습 기록 초기화</button></div>';el("clearHistory").onclick=()=>{if(confirm("풀이 기록과 오답·북마크를 초기화할까요?")){state.answers={};state.wrong=[];state.saved=[];state.history=[];save();render()}}}

function renderArchive(root){
const years=[
{y:2023,desc:"1~4회 · 3월 11일 / 6월 10일 / 9월 9일 / 12월 9일",page:"https://www.comcbt.com/xe/index.php?l=ko&mid=r2"},
{y:2022,desc:"1~3회 · 3월 12일(복원중) / 6월 11일 / 9월 3일",page:"https://www.comcbt.com/xe/index.php?l=ko&mid=r2"},
{y:2021,desc:"1·3·4회 · 3월 13일 / 9월 11일 / 12월 11일",page:"https://www.comcbt.com/xe/index.php?l=ko&mid=r2"},
{y:2020,desc:"2~4회 · 6월 13일 / 10월 10일 / 12월 12일",page:"https://www.comcbt.com/xe/index.php?l=ko&mid=r2"},
{y:2019,desc:"1~4회 · 3월 16일 / 6월 15일 / 9월 21일 / 12월 14일",page:"https://www.comcbt.com/xe/index.php?l=ko&mid=r2"},
{y:2018,desc:"게시판에서 회차별 확인",page:"https://www.comcbt.com/xe/index.php?l=ko&mid=r2"},
